stages:
  validate:
    cmd: PYTHONPATH=src python -m inventory_forecasting.data.validate --input-dir store-sales-time-series-forecasting
    deps:
      - src/inventory_forecasting/data/contracts.py
      - src/inventory_forecasting/data/landing.py
      - configs/sources.yaml

  prepare:
    cmd: PYTHONPATH=src python -m inventory_forecasting.data.features --input-dir store-sales-time-series-forecasting --cutoff 2017-07-31 --output data/processed/training_features.parquet
    deps:
      - store-sales-time-series-forecasting/train.csv
      - store-sales-time-series-forecasting/stores.csv
      - store-sales-time-series-forecasting/holidays_events.csv
      - store-sales-time-series-forecasting/oil.csv
      - store-sales-time-series-forecasting/transactions.csv
      - src/inventory_forecasting/data/features.py
      - params.yaml
    outs:
      - data/processed/training_features.parquet

  train:
    cmd: PYTHONPATH=src python -m inventory_forecasting.models.train --input-dir store-sales-time-series-forecasting --model-dir data/models
    deps:
      - store-sales-time-series-forecasting/train.csv
      - store-sales-time-series-forecasting/stores.csv
      - store-sales-time-series-forecasting/holidays_events.csv
      - store-sales-time-series-forecasting/oil.csv
      - store-sales-time-series-forecasting/transactions.csv
      - src/inventory_forecasting/models/train.py
      - src/inventory_forecasting/models/global_model.py
      - src/inventory_forecasting/models/baseline.py
      - src/inventory_forecasting/models/metrics.py
      - params.yaml
      - configs/business.yaml
    outs:
      - data/models/global_model.joblib
      - data/models/metrics.json

  forecast:
    cmd: PYTHONPATH=src python -m inventory_forecasting.product.forecast --input-dir store-sales-time-series-forecasting --cutoff 2017-08-15 --output-dir data/forecasts --model data/models/global_model.joblib
    deps:
      - store-sales-time-series-forecasting/train.csv
      - store-sales-time-series-forecasting/stores.csv
      - store-sales-time-series-forecasting/holidays_events.csv
      - store-sales-time-series-forecasting/oil.csv
      - store-sales-time-series-forecasting/transactions.csv
      - data/models/global_model.joblib
      - src/inventory_forecasting/product/forecast.py
      - src/inventory_forecasting/product/order.py
      - configs/business.yaml
      - params.yaml
    outs:
      - data/forecasts/forecast_2017-08-15.parquet
      - data/forecasts/order_2017-08-15.parquet

  monitor:
    cmd: PYTHONPATH=src python -m inventory_forecasting.product.monitor --input-dir store-sales-time-series-forecasting --forecast-dir data/forecasts --reports-dir data/reports
    deps:
      - store-sales-time-series-forecasting/train.csv
      - data/forecasts/forecast_2017-08-15.parquet
      - src/inventory_forecasting/product/monitor.py
      - src/inventory_forecasting/models/metrics.py
      - configs/business.yaml
    outs:
      - data/reports/performance.json
      - data/reports/performance_detail.parquet
