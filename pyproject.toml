[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-forecasting-lab1"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15,<23",
  "scikit-learn>=1.4,<2",
  "pyyaml>=6,<7",
  "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

